# Activate with --spring.profiles.active=ec2-simulator (combine with the
# postgres profile once that's also needed: --spring.profiles.active=postgres,ec2-simulator).
# Points the backend's simulator client at the EC2-hosted Production Simulator
# (docs/19-aws-strategy.md Phase 3) instead of localhost. SIMULATOR_BASE_URL
# comes from backend/.env (gitignored, never committed) -- set it to
# http://<current EC2 public IP>:8090. The IP is non-static unless an Elastic
# IP is attached; check infra/aws/ec2/production-simulator.json for the
# instance id and re-fetch the current address with:
#   aws ec2 describe-instances --profile ic-ec2 --region ap-south-1 \
#     --instance-ids <instance_id> --query 'Reservations[0].Instances[0].PublicIpAddress'
incidentcommand.simulator.base-url=${SIMULATOR_BASE_URL:http://127.0.0.1:8090}
