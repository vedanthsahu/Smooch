# Activate with --spring.profiles.active=postgres once a real Postgres
# (local Docker or RDS) is available. Credentials come from env vars -- never
# commit real values here. See docs/15-security-and-rbac.md secrets note.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentcommand}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:incidentcommand}
spring.datasource.password=${DB_PASSWORD:}

# TODO: no migration tool (Flyway/Liquibase) exists yet, so there's no schema
# for "validate" to check against -- using "update" as a stand-in, same as
# the H2 dev profile. This is a known gap: "update" silently applying schema
# changes is not something to carry into a real deployment (RDS) without a
# proper migration tool in front of it. Revisit before Level 10 (AWS phase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
