# Activate with --spring.profiles.active=postgres. Targets AWS RDS by default
# now (docs/19-aws-strategy.md Phase 4) -- values come from backend/.env
# (loaded by spring-dotenv, gitignored, never committed) or real env vars.
# See docs/15-security-and-rbac.md secrets note.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:incidentcommand}?sslmode=${DB_SSLMODE:require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway (backend/src/main/resources/db/migration) owns the schema here --
# Hibernate only validates its entity mappings against it, never mutates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# S3 (docs/19-aws-strategy.md) -- incident report exports, see IncidentReportExportService.
incidentcommand.s3.enabled=${S3_ENABLED:true}
incidentcommand.s3.bucket=${AWS_S3_BUCKET}
incidentcommand.s3.region=${AWS_REGION:ap-south-1}
