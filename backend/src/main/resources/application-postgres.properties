# Activate with --spring.profiles.active=postgres once a real Postgres
# (local Docker or RDS) is available. Credentials come from env vars -- never
# commit real values here. See docs/15-security-and-rbac.md secrets note.
#
# DB_URL default points at the WSL2 VM's direct IP, not localhost: on this
# machine WSL2's automatic localhost->Windows port forwarding doesn't work
# for Docker container ports (likely org network/security policy), so
# "localhost:5433" from a Windows-native process never reaches the
# WSL-hosted container. The VM IP (`wsl hostname -I` from Ubuntu) works
# but can change on WSL restart -- override with DB_URL if it drifts, or
# fix it permanently by enabling WSL2 "mirrored" networking mode in
# %UserProfile%\.wslconfig ([wsl2] networkingMode=mirrored) and restarting WSL.
spring.datasource.url=${DB_URL:jdbc:postgresql://172.19.179.185:5433/incidentcommand}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:incidentcommand}
spring.datasource.password=${DB_PASSWORD:incidentcommand}

# Flyway (backend/src/main/resources/db/migration) owns the schema here --
# Hibernate only validates its entity mappings against it, never mutates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
