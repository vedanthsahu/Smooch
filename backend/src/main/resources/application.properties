spring.application.name=backend
server.port=8080

incidentcommand.ai-engine.base-url=http://127.0.0.1:8091
incidentcommand.simulator.base-url=http://127.0.0.1:8090
incidentcommand.detection.poll-interval-ms=5000

# Local dev DB: file-based H2, no Docker/Postgres required to get moving.
# Swap to the postgres profile (application-postgres.properties) once RDS/local
# Postgres is available -- see docs/18-deployment-strategy.md.
spring.datasource.url=jdbc:h2:file:./data/incidentcommand;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 stays on Hibernate auto-DDL for zero-setup local dev; Flyway
# (backend/src/main/resources/db/migration) only targets the postgres
# profile -- see application-postgres.properties.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
