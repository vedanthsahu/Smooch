spring.application.name=backend
server.port=8080

incidentcommand.ai-engine.base-url=http://127.0.0.1:8091
incidentcommand.simulator.base-url=http://127.0.0.1:8090
incidentcommand.detection.poll-interval-ms=5000

# Local dev DB: file-based H2, no Docker/Postgres required to get moving.
# Swap to the postgres profile (application-postgres.properties) once RDS/local
# Postgres is available -- see docs/18-deployment-strategy.md.
spring.datasource.url=jdbc:h2:file:./data/incidentcommand;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 stays on Hibernate auto-DDL for zero-setup local dev; Flyway
# (backend/src/main/resources/db/migration) only targets the postgres
# profile -- see application-postgres.properties.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# No AWS in the local H2 profile -- S3 exports are a no-op (see
# IncidentReportExportService / S3StorageService fail-soft behavior).
incidentcommand.s3.enabled=false
incidentcommand.s3.region=ap-south-1

# CloudWatch Logs demo panel (see infra/aws/cloudwatch/production-simulator-logging.json).
# Independent of the DB profile on purpose -- you can run H2 locally for speed
# while still pointing the Logs panel at the real EC2 simulator's logs. Off by
# default, same fail-soft posture as S3. incidentcommand.cloudwatch.access-key-id/
# secret-access-key are a DIFFERENT credential from AWS_ACCESS_KEY_ID (S3's) --
# see CloudWatchLogsConfig for why.
incidentcommand.cloudwatch.enabled=${CLOUDWATCH_ENABLED:false}
incidentcommand.cloudwatch.region=ap-south-1
incidentcommand.cloudwatch.log-group=/incidentcommand/production-simulator
incidentcommand.cloudwatch.access-key-id=${AWS_LOGS_ACCESS_KEY_ID:}
incidentcommand.cloudwatch.secret-access-key=${AWS_LOGS_SECRET_ACCESS_KEY:}
incidentcommand.cloudwatch.max-events=100
incidentcommand.cloudwatch.window-minutes=15
